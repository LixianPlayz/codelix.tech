<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dream Observatory</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="sky"></canvas>

  <main class="shell">
    <section class="hero">
      <div>
        <p class="eyebrow">Interactive Thought Engine</p>
        <h1>Dream Observatory</h1>
        <p class="subtext">
          Capture strange ideas, launch them into orbit, and watch your thoughts become constellations.
        </p>
      </div>

      <div class="orb">
        <span></span>
      </div>
    </section>

    <section class="control-panel">
      <div class="composer">
        <textarea id="dreamInput" placeholder="Write a strange idea, dream, invention, scene, or impossible question..."></textarea>

        <div class="composer-actions">
          <button id="saveDream">Launch Dream</button>
          <button id="randomPrompt">Cosmic Prompt</button>
          <button id="soundToggle">Sound Off</button>
        </div>
      </div>

      <aside class="stats">
        <div>
          <span id="dreamCount">0</span>
          <p>dreams stored</p>
        </div>
        <div>
          <span id="starCount">0</span>
          <p>stars mapped</p>
        </div>
      </aside>
    </section>

    <section class="orbit-board" id="orbitBoard"></section>

    <section class="manual">
      <h2>Controls</h2>
      <div class="keys">
        <kbd>Enter</kbd><span>Launch dream</span>
        <kbd>R</kbd><span>Generate prompt</span>
        <kbd>C</kbd><span>Clear orbit</span>
        <kbd>S</kbd><span>Toggle sound</span>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
