<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HyperRail</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="world"></canvas>

  <main class="interface">
    <section class="intro" id="intro">
      <p class="eyebrow">Experimental Transit Experience</p>
      <h1>HyperRail</h1>
      <p class="intro-text">
        Board a silent high-speed rail line through cities, oceans, storms, tunnels, and endless synthetic landscapes.
      </p>

      <button id="enterCab">Enter Cab</button>
    </section>

    <section class="cockpit hidden" id="cockpit">
      <div class="top-strip">
        <span id="routeName">NEW TOKYO → ATLANTIS</span>
        <span id="weatherName">CLEAR SKY</span>
        <span id="clock">06:00</span>
      </div>

      <div class="dashboard">
        <article>
          <span id="speed">0</span>
          <p>mph</p>
        </article>

        <article>
          <span id="distance">0.0</span>
          <p>miles</p>
        </article>

        <article>
          <span id="phase">Boarding</span>
          <p>status</p>
        </article>
      </div>

      <div class="route-panel">
        <button data-route="NEW TOKYO → ATLANTIS">Ocean Line</button>
        <button data-route="OSAKA → ARCTIC GATE">Snow Line</button>
        <button data-route="NEON-7 → DUSK CITY">Night Line</button>
      </div>

      <div class="announcement" id="announcement">
        Welcome aboard HyperRail service 07.
      </div>
    </section>
  </main>

  <div class="vignette"></div>
  <div class="scanlines"></div>

  <script src="script.js"></script>
</body>
</html>
